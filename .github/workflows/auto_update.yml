name: Lotto DB Auto Update

on:
  schedule:
    - cron: '45 11 * * 6' # 한국 시간 매주 토요일 오후 8시 45분 자동 실행
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas beautifulsoup4 curl_cffi openpyxl

      - name: Run Crawler
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: python lotto_crawler.py
