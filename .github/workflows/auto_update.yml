name: Lotto Auto Crawler

on:
  schedule:
    - cron: '50 11 * * 6' # 한국시간 토요일 20:50
    - cron: '0 12 * * 6'  # 한국시간 토요일 21:00
    - cron: '15 12 * * 6' # 한국시간 토요일 21:15
    - cron: '30 12 * * 6' # 한국시간 토요일 21:30
    - cron: '45 12 * * 6' # 한국시간 토요일 21:45
    - cron: '0 13 * * 6'  # 한국시간 토요일 22:00
    - cron: '30 13 * * 6' # 한국시간 토요일 22:30
  workflow_dispatch:

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4 pandas openpyxl

      - name: Run Crawler
        env:
          MY_GITHUB_TOKEN: ${{ secrets.MY_GITHUB_TOKEN }}
        run: |
          python lotto_crawler.py
